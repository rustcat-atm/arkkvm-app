[package]
name = "redfish"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "A minimal Redfish surface over the device's own RPC registry — power and virtual media"

[dependencies]
futures = "0.3"
httprpc = { path = "../httprpc" }
salvo = { version = "0.84", features = ["server", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
